<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Zhonggu Global Scaling Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--surface:#0a0a0a;--surface2:#111;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text-primary:#fff;--text-secondary:#ccc;--text-muted:#999;
  --p1:#22c55e;--p1-glow:rgba(34,197,94,0.22);
  --p2:#eab308;--p2-glow:rgba(234,179,8,0.22);
  --p3:#3b82f6;--p3-glow:rgba(59,130,246,0.22);
  --ps:#ec4899;--ps-glow:rgba(236,72,153,0.22);
}
html,body{background:var(--bg);color:var(--text-primary);font-family:'Inter',sans-serif;min-height:100vh}
body{display:flex;flex-direction:column;align-items:center;padding:48px 32px 72px}

/* ── Lang toggle ── */
#lang-bar{width:100%;max-width:1100px;display:flex;justify-content:flex-end;margin-bottom:18px}
#lang-toggle{display:flex;background:var(--surface2);border:1px solid var(--border2);border-radius:100px;padding:3px;gap:3px}
.lang-btn{padding:6px 16px;border-radius:100px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text-muted);font-family:'Inter',sans-serif;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.lang-btn.active{background:var(--text-primary);color:#000}
.lang-btn:hover:not(.active){color:var(--text-secondary)}

/* ── Header ── */
#header{width:100%;max-width:1100px;margin-bottom:28px;text-align:center}
#eyebrow{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
#main-title{font-family:'Inter Tight',sans-serif;font-size:34px;font-weight:700;letter-spacing:-0.025em;margin-bottom:11px;line-height:1.1}
#subtitle{font-size:14px;color:var(--text-secondary);max-width:620px;margin:0 auto;line-height:1.65;transition:color 0.4s;min-height:44px}

/* ── Phase controls ── */
#controls{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;justify-content:center;align-items:center}
.phase-btn{display:flex;align-items:center;gap:10px;padding:11px 28px;border-radius:100px;font-size:13px;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.25s ease;background:var(--surface2);border:1px solid var(--border2);color:var(--text-secondary);white-space:nowrap;-webkit-tap-highlight-color:transparent}
.phase-btn .btn-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.phase-btn .btn-num{font-weight:600;color:var(--text-primary)}
.phase-btn .btn-sep{color:var(--text-muted);margin:0 2px}
.phase-btn .btn-desc{color:var(--text-muted);font-weight:400;font-size:12px}
.phase-btn:hover .btn-num{color:var(--text-primary)}
.phase-btn:hover .btn-desc{color:var(--text-secondary)}
.phase-btn:hover{transform:translateY(-1px)}
.phase-btn.active{border-color:transparent;transform:translateY(-1px)}
.phase-btn.active .btn-num,.phase-btn.active .btn-sep,.phase-btn.active .btn-desc{color:#000}
#btn-clear{padding:11px 22px;border-radius:100px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.22s;background:transparent;border:1px solid var(--border);color:var(--text-muted);-webkit-tap-highlight-color:transparent}
#btn-clear:hover{border-color:var(--border2);color:var(--text-secondary)}
#btn-sister{padding:11px 22px;border-radius:100px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all 0.22s;background:transparent;border:1px solid rgba(236,72,153,0.4);color:rgba(236,72,153,0.7);-webkit-tap-highlight-color:transparent}
#btn-sister:hover{border-color:var(--ps);color:var(--ps)}
#btn-sister.active{background:var(--ps);color:#fff;border-color:var(--ps);box-shadow:0 4px 20px var(--ps-glow)}

/* ── Map frame ── */
#map-frame{width:100%;max-width:1100px;background:var(--surface);border:1px solid var(--border);border-radius:20px;overflow:hidden;position:relative;box-shadow:0 0 0 1px rgba(255,255,255,0.03),0 40px 100px rgba(0,0,0,0.7),inset 0 1px 0 rgba(255,255,255,0.04);touch-action:none}@media(max-width:767px){#map-frame{touch-action:pan-y pinch-zoom}}
#hover-chip{position:absolute;top:16px;right:16px;z-index:20;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:10px;padding:8px 14px;min-width:155px;pointer-events:none}
#ngo-chip{position:absolute;top:16px;left:16px;z-index:20;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:10px;padding:8px 14px;pointer-events:auto;cursor:pointer;transition:border-color 0.2s}
#ngo-chip-label{font-size:9px;text-transform:uppercase;letter-spacing:0.16em;color:#aaa;margin-bottom:3px}
#ngo-chip-count{font-size:22px;font-weight:600;color:var(--text-primary);line-height:1;margin-bottom:2px}
#ngo-chip-text{font-size:10px;color:var(--text-secondary);white-space:nowrap}
#ngo-chip-hint{font-size:9px;color:rgba(255,255,255,0.35);margin-top:4px;white-space:nowrap;letter-spacing:0.02em}
#ngo-chip:hover #ngo-chip-hint{color:rgba(255,255,255,0.55)}
#hover-chip-label{font-size:9px;text-transform:uppercase;letter-spacing:0.16em;color:#aaa;margin-bottom:3px}
#hover-chip-name{font-size:12px;font-weight:500;color:var(--text-secondary);text-align:right;transition:color 0.2s}
#map-svg-wrap{width:100%;display:block;line-height:0}
#map-svg-wrap svg{display:block;width:100%;touch-action:none}@media(max-width:767px){#map-svg-wrap svg{touch-action:pinch-zoom}}

/* ── Desktop info card ── */
#info-card{position:absolute;bottom:20px;left:20px;z-index:30;background:rgba(4,4,4,0.94);backdrop-filter:blur(24px);border:1px solid var(--border2);border-radius:16px;padding:20px 22px 18px;min-width:260px;max-width:310px;max-height:72vh;overflow-y:auto;opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity 0.32s ease,transform 0.32s ease;scrollbar-width:thin;scrollbar-color:#555 transparent}
#info-card::-webkit-scrollbar{width:3px}
#info-card::-webkit-scrollbar-thumb{background:#555;border-radius:2px}
#info-card.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#info-card-close{position:absolute;top:14px;right:16px;font-size:18px;line-height:1;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:2px 4px;transition:color 0.15s}
#info-card-close:hover{color:var(--text-secondary)}
#info-card-phase{font-size:9px;text-transform:uppercase;letter-spacing:0.18em;font-weight:500;margin-bottom:7px}
#info-card-country{font-family:'Inter Tight',sans-serif;font-size:20px;font-weight:700;color:#fff;letter-spacing:-0.01em;margin-bottom:5px;padding-right:24px}
#info-card-approach{font-size:11px;color:#888;font-style:italic;line-height:1.5;margin-bottom:14px}
#info-card-divider{height:1px;background:var(--border);margin-bottom:14px}
#info-card-ngo-label{font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-muted);margin-bottom:10px}
#info-card-ngos{display:flex;flex-direction:column;gap:0}

/* ── Mobile info card ── */
#mobile-info-card{display:none;width:100%;max-width:1100px;margin-top:12px;position:relative;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:20px 22px 18px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 0.32s ease,transform 0.32s ease}
#mobile-info-card.visible{opacity:1;transform:translateY(0);pointer-events:auto}
#m-card-close{position:absolute;top:14px;right:16px;font-size:22px;line-height:1;color:var(--text-muted);cursor:pointer;background:none;border:none;padding:4px 6px;-webkit-tap-highlight-color:transparent}
#m-card-phase{font-size:9px;text-transform:uppercase;letter-spacing:0.18em;font-weight:500;margin-bottom:7px}
#m-card-country{font-family:'Inter Tight',sans-serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-0.01em;margin-bottom:5px;padding-right:28px}
#m-card-approach{font-size:12px;color:var(--text-muted);font-style:italic;line-height:1.5;margin-bottom:14px}
#m-card-divider{height:1px;background:var(--border);margin-bottom:14px}
#m-card-ngo-label{font-size:9px;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-muted);margin-bottom:10px}
#m-card-ngos{display:flex;flex-direction:column;gap:0}

/* ── NGO rows (shared) ── */
.ngo-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.ngo-row:last-child{border-bottom:none;padding-bottom:0}
.ngo-row-top{display:flex;align-items:flex-start;gap:8px}
.ngo-bullet{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:6px}
.ngo-name{font-family:'Noto Sans SC','Inter',sans-serif;font-weight:400;font-size:13px;color:rgba(255,255,255,0.95);line-height:1.4;letter-spacing:0.01em}
.ngo-link{font-size:10px;padding-left:12px;margin-top:2px}
.ngo-link a{color:rgba(255,255,255,0.5);text-decoration:none;transition:color 0.15s;letter-spacing:0.01em}
.ngo-link a:hover{color:rgba(255,255,255,0.65)}

/* ── Objective ── */
#objective{width:100%;max-width:1100px;margin-top:14px;padding:14px 20px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:stretch;gap:14px;transition:border-color 0.35s;min-height:56px}
#objective-accent{width:3px;border-radius:2px;background:var(--border2);flex-shrink:0;transition:background 0.35s}
#objective-text{font-size:13px;line-height:1.7;color:#999;transition:color 0.35s;align-self:center}

/* ── Disclaimer ── */
#disclaimer{width:100%;max-width:1100px;margin-top:24px;font-size:11px;color:#666;line-height:1.65;text-align:center}

/* ── SVG annotation text ── */
.ngo-annotation{font-family:'Noto Sans SC','Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300}

/* ══ MOBILE ══ */
@media(max-width:767px){
  body{padding:28px 16px 52px 16px}
  #eyebrow{font-size:10px;margin-bottom:10px}
  #main-title{font-size:22px;margin-bottom:8px}
  #subtitle{font-size:13px;min-height:unset}
  #controls{flex-direction:column;align-items:stretch;gap:8px;margin-bottom:16px}
  .phase-btn{padding:12px 18px;white-space:normal;justify-content:flex-start;align-items:center;flex-wrap:nowrap}
  .phase-btn .btn-num{white-space:nowrap;flex-shrink:0}
  .phase-btn .btn-sep{white-space:nowrap;flex-shrink:0}
  .phase-btn .btn-desc{white-space:normal;flex:1;text-align:left}
  #btn-clear{align-self:center}
  #map-frame{border-radius:14px}
  #map-svg-wrap svg{height:260px!important}
  #hover-chip{display:none}
  #ngo-chip{display:none}
  #info-card{display:none!important}
  #mobile-info-card{display:none}
  #mobile-info-card.visible{display:block}
  #objective{padding:12px 14px}
  #objective-text{font-size:12px}
  #disclaimer{padding:0 4px}
}
@media(min-width:768px) and (max-width:1023px){
  body{padding:40px 24px 60px}
  #main-title{font-size:26px}
  .phase-btn{padding:10px 20px;font-size:12px}
  .phase-btn .btn-desc{font-size:11px}
}

/* ── NGO List Modal ── */
#ngo-modal-overlay{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity 0.28s ease;
}
#ngo-modal-overlay.open{opacity:1;pointer-events:auto}

#ngo-modal{
  width:min(1080px,94vw);max-height:82vh;
  background:rgba(8,8,8,0.95);backdrop-filter:blur(24px);
  border:1px solid var(--border2);border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(12px);transition:transform 0.28s ease;
  box-shadow:0 32px 80px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.04);
}
#ngo-modal-overlay.open #ngo-modal{transform:translateY(0)}

#ngo-modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px 16px;border-bottom:1px solid var(--border);flex-shrink:0;
}
#ngo-modal-title{font-family:'Inter Tight',sans-serif;font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.01em}
#ngo-modal-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
#ngo-modal-close{
  width:32px;height:32px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border2);color:var(--text-secondary);
  font-size:18px;line-height:1;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0;
}
#ngo-modal-close:hover{background:var(--surface);color:#fff}

#ngo-modal-body{overflow-y:auto;padding:20px 24px 24px;flex:1;
  scrollbar-width:thin;scrollbar-color:#555 transparent}
#ngo-modal-body::-webkit-scrollbar{width:4px}
#ngo-modal-body::-webkit-scrollbar-thumb{background:#555;border-radius:2px}

/* Country cards grid */
#ngo-modal-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}
.modal-country-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:14px 16px;
}
.modal-country-name{
  font-size:13px;font-weight:600;color:var(--text-primary);
  margin-bottom:8px;letter-spacing:-0.01em;
  padding-bottom:7px;border-bottom:1px solid var(--border);
}
.modal-ngo-item{
  display:flex;align-items:flex-start;gap:6px;
  padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);
}
.modal-ngo-item:last-child{border-bottom:none;padding-bottom:0}
.modal-ngo-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0;margin-top:5px}
.modal-ngo-name{font-size:11.5px;color:rgba(255,255,255,0.88);line-height:1.4;flex:1}
.modal-ngo-link{font-size:10px;color:rgba(255,255,255,0.45);text-decoration:none;
  flex-shrink:0;margin-top:1px;transition:color 0.15s;align-self:flex-start}
.modal-ngo-link:hover{color:rgba(255,255,255,0.65)}

/* Make chip clickable */
#ngo-chip{cursor:pointer}
#ngo-chip:hover{border-color:rgba(255,255,255,0.25)}

@media(max-width:767px){
  #ngo-modal{width:94vw;max-height:88vh;border-radius:14px}
  #ngo-modal-grid{grid-template-columns:1fr 1fr}
  #ngo-modal-header{padding:16px 16px 12px}
  #ngo-modal-body{padding:14px 16px 18px}
  .modal-country-card{padding:10px 12px}
}
@media(max-width:420px){
  #ngo-modal-grid{grid-template-columns:1fr}
}

/* ── Mobile Bottom Bar ── */
#mobile-ngo-bar{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  padding:12px 16px 20px;
  pointer-events:none;
}
#mobile-ngo-bar-btn{
  display:flex;width:100%;
  align-items:center;justify-content:space-between;
  padding:14px 20px;border-radius:14px;cursor:pointer;
  font-family:'Inter',sans-serif;font-size:14px;font-weight:600;
  background:rgba(12,12,12,0.97);backdrop-filter:blur(20px);
  border:1px solid var(--border2);color:#fff;
  -webkit-tap-highlight-color:transparent;
  transition:border-color 0.2s;
  box-shadow:0 4px 24px rgba(0,0,0,0.6);
  pointer-events:auto;
}
#mobile-ngo-bar-btn:hover{border-color:rgba(255,255,255,0.25)}
#mobile-bar-left{display:flex;align-items:center;gap:12px}
#mobile-bar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#mobile-bar-text{display:flex;align-items:baseline;gap:8px}
#mobile-bar-count{font-size:22px;font-weight:700;line-height:1}
#mobile-bar-label{font-size:13px;color:#ccc;font-weight:500}
#mobile-bar-arrow{font-size:16px;color:var(--text-muted)}

/* ── Mobile Bottom Sheet ── */
#mobile-sheet-overlay{
  display:none;position:fixed;inset:0;z-index:160;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  opacity:0;transition:opacity 0.3s ease;
  pointer-events:none;
}
#mobile-sheet-overlay.open{opacity:1;pointer-events:auto}

#mobile-sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:161;
  background:rgba(10,10,10,0.98);backdrop-filter:blur(24px);
  border-top:1px solid var(--border2);border-radius:20px 20px 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
  box-shadow:0 -8px 40px rgba(0,0,0,0.6);
  touch-action:pan-y;
}
#mobile-sheet.open{transform:translateY(0)}
#mobile-sheet.dragging{transition:none}

#mobile-sheet-handle{
  display:flex;justify-content:center;padding:12px 0 4px;flex-shrink:0;
}
#mobile-sheet-handle-bar{
  width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.2);
}
#mobile-sheet-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
}
#mobile-sheet-title{font-size:16px;font-weight:700;color:#fff;font-family:'Inter Tight',sans-serif}
#mobile-sheet-meta{font-size:11px;color:var(--text-muted);margin-top:2px}
#mobile-sheet-close{
  width:30px;height:30px;border-radius:50%;background:var(--surface2);
  border:1px solid var(--border2);color:var(--text-secondary);
  font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;-webkit-tap-highlight-color:transparent;
}
#mobile-sheet-body{
  overflow-y:auto;padding:16px 16px 32px;flex:1;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
#mobile-sheet-body::-webkit-scrollbar{display:none}
#mobile-sheet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Show bar only on mobile */
@media(max-width:767px){
  #mobile-ngo-bar{display:block}
  body{padding-bottom:100px !important}
  #mobile-sheet-overlay{display:block}
}
</style>
</head>
<body>

<!-- Lang toggle -->
<div id="lang-bar">
  <div id="lang-toggle">
    <button class="lang-btn active" id="lang-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="lang-cn" onclick="setLang('cn')">中文</button>
  </div>
</div>

<!-- Header -->
<div id="header">
  <div id="eyebrow"></div>
  <h1 id="main-title"></h1>
  <p id="subtitle"></p>
</div>

<!-- Phase controls -->
<div id="controls">
  <button class="phase-btn" id="btn1" onclick="togglePhase(1)">
    <span class="btn-dot" style="background:var(--p1)"></span>
    <span class="btn-num" id="btn1-num"></span>
    <span class="btn-sep">·</span>
    <span class="btn-desc" id="btn1-desc"></span>
  </button>
  <button class="phase-btn" id="btn2" onclick="togglePhase(2)">
    <span class="btn-dot" style="background:var(--p2)"></span>
    <span class="btn-num" id="btn2-num"></span>
    <span class="btn-sep">·</span>
    <span class="btn-desc" id="btn2-desc"></span>
  </button>
  <button class="phase-btn" id="btn3" onclick="togglePhase(3)">
    <span class="btn-dot" style="background:var(--p3)"></span>
    <span class="btn-num" id="btn3-num"></span>
    <span class="btn-sep">·</span>
    <span class="btn-desc" id="btn3-desc"></span>
  </button>
  <button id="btn-sister" onclick="toggleSisterCities()">Sister Cities</button>
  <button id="btn-clear" onclick="resetAll()"></button>
</div>

<!-- Map -->
<div id="map-frame">
  <div id="hover-chip">
    <div id="hover-chip-label"></div>
    <div id="hover-chip-name">—</div>
  </div>
  <div id="ngo-chip" onclick="openNgoModal()" title="View all NGOs">
    <div id="ngo-chip-label"></div>
    <div id="ngo-chip-count"></div>
    <div id="ngo-chip-hint"></div>
  </div>
  <div id="info-card">
    <button id="info-card-close" onclick="closeCard()">×</button>
    <div id="info-card-phase"></div>
    <div id="info-card-country"></div>
    <div id="info-card-approach"></div>
    <div id="info-card-divider"></div>
    <div id="info-card-ngo-label"></div>
    <div id="info-card-ngos"></div>
  </div>
  <div id="map-svg-wrap"></div>
</div>

<!-- Mobile card -->
<div id="mobile-info-card">
  <button id="m-card-close" onclick="closeMobileCard()">×</button>
  <div id="m-card-phase"></div>
  <div id="m-card-country"></div>

  document.getElementById('lang-en').classList.toggle('active', l==='en');

  document.documentElement.lang = l==='cn' ? 'zh-CN' : 'en';
  renderUI();
  updateMobileBar();
  document.getElementById('btn-sister').textContent = lang==='cn' ? '友好城市' : 'Sister Cities';
  if (document.getElementById('mobile-sheet').classList.contains('open')) { closeMobileSheet(); openMobileSheet(); }

    if (window.innerWidth <= 767) showMobileCard(selectedCountry);

  // Re-render annotations
  if (activePhase !== null) drawAnnotations();

function resolveCountry(name) {
  const n = name.toLowerCase().trim();
  for (const [c, aliases] of Object.entries(ALIASES)) {
    if (c.toLowerCase()===n || aliases.some(a=>a.toLowerCase()===n)) return c;
  }
  return name;
}

function getPhaseForCountry(name) {
  const r = resolveCountry(name);
  return NGO_DATA[r]?.phase || null;
}

let sisterActive = false;
const NGO_COUNTS = { 1: 9, 2: 21, 3: 8 };
const PHASE_COLORS = { 1:'#22c55e', 2:'#eab308', 3:'#3b82f6' };
const PHASE_HOVER  = { 1:'#4ade80', 2:'#facc15', 3:'#60a5fa' };
const PHASE_GLOW   = { 1:'rgba(34,197,94,0.22)', 2:'rgba(234,179,8,0.22)', 3:'rgba(59,130,246,0.22)' };

function getFill(name) {
  const ph = getPhaseForCountry(name);
  if (activePhase===null) return ph!==null ? '#1f1f1f' : '#161616';
  return ph===activePhase ? PHASE_COLORS[activePhase] : '#141414';
}
function getHoverFill(name) {
  const ph = getPhaseForCountry(name);
  if (activePhase===null) return ph!==null ? '#2c2c2c' : '#1e1e1e';
  return ph===activePhase ? PHASE_HOVER[activePhase] : '#1a1a1a';
}

function animateAll() {
  if (!svgG) return;
  svgG.selectAll('path.country')
    .transition().duration(520).ease(d3.easeCubicOut)
    .attr('fill', function(){ return getFill(d3.select(this).attr('data-name')); });
}

// ═══════════════════════════════════════════
// ANNOTATIONS
// ═══════════════════════════════════════════
function drawAnnotations() {
  if (!annotationsG || !projFn) return;
  annotationsG.selectAll('*').remove();
  if (activePhase===null) return;

  const col = PHASE_COLORS[activePhase];

  Object.entries(NGO_DATA).forEach(([country, data]) => {
    if (data.phase !== activePhase) return;
    const centroid = CENTROIDS[country];
    const off = LABEL_OFF[country];
    if (!centroid || !off) return;

    const [px, py] = projFn(centroid);
    const [dx, dy, anchor] = off;
    const tx = px + dx, ty = py + dy;

    // Pick first non-Labdoo NGO for annotation label; fall back to first if all are Labdoo
    const nonLabdooFirst = data.ngos.find(n => !n.name.toLowerCase().startsWith("labdoo"));
    const featured = nonLabdooFirst || data.ngos[0];
    const firstName = lang==="cn" ? featured.name_cn : featured.name;
    const extra = data.ngos.length - 1;

    annotationsG.append('line')
      .attr('x1',px).attr('y1',py).attr('x2',tx).attr('y2',ty)
      .attr('stroke',col).attr('stroke-width',0.5).attr('stroke-opacity',0)
      .attr('stroke-dasharray','2,2')
      .transition().delay(60).duration(400).attr('stroke-opacity',0.32);

    annotationsG.append('circle')
      .attr('cx',px).attr('cy',py).attr('r',2)
      .attr('fill',col).attr('opacity',0)
      .transition().delay(60).duration(400).attr('opacity',0.65);

    const labelG = annotationsG.append('g').attr('opacity',0);

    labelG.append('text')
      .attr('x', tx+(anchor==='start'?3:-3))
      .attr('y', ty)
      .attr('text-anchor',anchor)
      .attr('dominant-baseline','middle')
      .attr('fill','rgba(255,255,255,0.88)')
      .attr('class','ngo-annotation')
      .style('font-size','5.5px')
      .style('pointer-events','none')
      .text(firstName);

    if (extra>0) {
      const moreText = lang==='cn' ? `+${extra} 更多` : `+${extra} more`;
      labelG.append('text')
        .attr('x', tx+(anchor==='start'?3:-3))
        .attr('y', ty+7)
        .attr('text-anchor',anchor)
        .attr('dominant-baseline','middle')
        .attr('fill','rgba(255,255,255,0.55)')
        .style('font-size','4.5px')
        .style('font-family','Inter,sans-serif')
        .style('pointer-events','none')
        .text(moreText);
    }
    labelG.transition().delay(100).duration(450).attr('opacity',1);
  });
}

// INFO CARDS
// ═══════════════════════════════════════════
function buildNgoHtml(ngos, color) {
  // Sort: non-Labdoo first alphabetically, then Labdoo entries at end
  const nonLabdoo = [...ngos].filter(n => !n.name.toLowerCase().startsWith("labdoo"))
    .sort((a,b) => {
      const na = lang==="cn" ? a.name_cn : a.name;
      const nb = lang==="cn" ? b.name_cn : b.name;
      return na.localeCompare(nb);
    });
  const labdoos = [...ngos].filter(n => n.name.toLowerCase().startsWith("labdoo"))
    .sort((a,b) => {
      const na = lang==="cn" ? a.name_cn : a.name;
      const nb = lang==="cn" ? b.name_cn : b.name;
      return na.localeCompare(nb);
    });
  const sorted = [...nonLabdoo, ...labdoos];
  return sorted.map(ngo => {
    const name = lang==='cn' ? ngo.name_cn : ngo.name;
    const url = ngo.url && !ngo.url.includes('inactive') ? ngo.url : null;
    const domain = url ? url.replace(/^https?:\/\//,'').replace(/\/$/,'') : null;
    return `<div class="ngo-row">
      <div class="ngo-row-top">
        <span class="ngo-bullet" style="background:${color};margin-top:5px"></span>
        <span class="ngo-name">${name}</span>
      </div>
      ${domain ? `<div class="ngo-link"><a href="${url.startsWith('http')?url:'https://'+url}" target="_blank" rel="noopener">${domain} ↗</a></div>` : ''}
    </div>`;
  }).join('');
}

  const data = NGO_DATA[countryName];
  if (!data) return;
  selectedCountry = countryName;

  const C = COPY[lang];

function resetZoom() {
  if(!svgEl||!zoomBehavior)return;
  programmaticZoom = true;
  svgEl.transition().duration(500).ease(d3.easeCubicOut)
    .call(zoomBehavior.transform, d3.zoomIdentity)
    .on('end', () => { programmaticZoom = false; });
}

function zoomToCountry(name) {
  if(!svgG||!svgEl)return;
  const el=svgG.selectAll('path.country').filter(function(){return resolveCountry(d3.select(this).attr('data-name'))===name;}).node();
  if(!el)return;
  const b=el.getBBox();
  const W=+svgEl.attr('width'),H=+svgEl.attr('height');
  // On mobile use a slightly smaller scale so country fits within the short viewport
  const maxScale = window.innerWidth <= 767 ? 7 : 10;
  const scale=Math.min(maxScale,0.72/Math.max(b.width/W,b.height/H));
  const tx=W/2-scale*(b.x+b.width/2);
  const ty=H/2-scale*(b.y+b.height/2);
  programmaticZoom = true;
  svgEl.transition().duration(700).ease(d3.easeCubicInOut)
    .call(zoomBehavior.transform,d3.zoomIdentity.translate(tx,ty).scale(scale))
    .on('end', () => { programmaticZoom = false; });
}

// MAP INIT
// ═══════════════════════════════════════════
async function initMap() {
  const wrap=document.getElementById('map-svg-wrap');
  const W=wrap.offsetWidth||1100;
  const H=Math.round(W*0.52);

  const world=await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
  const countries=topojson.feature(world,world.objects.countries);
  const borders=topojson.mesh(world,world.objects.countries,(a,b)=>a!==b);

  const projection=d3.geoNaturalEarth1().scale(W/6.0).translate([W/2,H/2+H*0.03]);
  projFn=projection;
  const path=d3.geoPath().projection(projection);

  svgEl=d3.select('#map-svg-wrap').append('svg')
    .attr('width',W).attr('height',H)
    .attr('viewBox',`0 0 ${W} ${H}`)
    .style('display','block');

  zoomBehavior=d3.zoom().scaleExtent([1,14])
    .filter(function(event) {
      // On mobile: allow pinch-zoom (2 fingers) and programmatic zoom, block single-finger pan
      if (window.innerWidth <= 767) {
        if (programmaticZoom) return true; // always allow code-triggered zoom
        if (event.type === 'touchstart' || event.type === 'touchmove') {
          return event.touches && event.touches.length >= 2;
        }
        if (event.type === 'wheel') return true;
        return false;
      }
      return !event.ctrlKey || event.type === 'wheel';
    })
    .on('zoom',e=>{
      // On mobile: lock pan for finger gestures, but allow full transform for code
      if (window.innerWidth <= 767 && !programmaticZoom) {
        const t = e.transform;
        const W = +svgEl.attr('width'), H = +svgEl.attr('height');
        const cx = W/2 * (1 - t.k);
        const cy = H/2 * (1 - t.k);
        const locked = d3.zoomIdentity.translate(cx, cy).scale(t.k);
        svgG.attr('transform', locked);
        annotationsG.attr('transform', locked);
      } else {
        svgG.attr('transform',e.transform);
        annotationsG.attr('transform',e.transform);
      }
    });
  svgEl.call(zoomBehavior);

  svgG=svgEl.append('g');

  svgG.selectAll('path.country')
    .data(countries.features)
    .enter().append('path')
    .attr('class','country')
    .attr('data-name',d=>d.properties.name||'Unknown')
    .attr('d',path)
    .attr('fill',d=>getFill(d.properties.name||'Unknown'))
    .attr('stroke','#2e2e2e')
    .attr('stroke-width',0.6)
    .style('cursor','default')
    .on('mouseenter',function(e,d){
      const name=d.properties.name||'Unknown';
      document.getElementById('hover-chip-name').textContent=name;
      const ph=getPhaseForCountry(name);
      document.getElementById('hover-chip-name').style.color=(activePhase!==null&&ph===activePhase)?PHASE_COLORS[activePhase]:'';
      if(name!==selectedCountry) d3.select(this).interrupt().attr('fill',getHoverFill(name));
    })
    .on('mouseleave',function(e,d){
      const name=d.properties.name||'Unknown';
      document.getElementById('hover-chip-name').textContent='—';
      document.getElementById('hover-chip-name').style.color='';
      d3.select(this).interrupt().transition().duration(280).attr('fill',getFill(name));
    })
    .on('click',function(e,d){
      e.stopPropagation();
      const name=resolveCountry(d.properties.name||'Unknown');
      const ph=getPhaseForCountry(name);
      if(activePhase!==null&&ph===activePhase){
        if(selectedCountry===name){resetZoom();closeCard();document.getElementById('mobile-info-card').classList.remove('visible');selectedCountry=null;}
        else{zoomToCountry(name);showCard(name);}
      }
    });

  svgG.append('path').datum(borders).attr('d',path)
    .attr('fill','none').attr('stroke','#282828').attr('stroke-width',0.4);

  // ── Enlarged hit targets for small/hard-to-click countries ──
  const SMALL_TARGETS = {"South Korea": [127.5, 36.5], "Timor-Leste": [125.8, -8.8], "Philippines": [122, 12.5], "Cambodia": [104.9, 12.6], "Laos": [102.6, 17.9], "Bulgaria": [25.3, 42.7], "Netherlands": [5.3, 52.1], "Cuba": [-79.5, 21.8], "Ecuador": [-78.2, -1.3], "Uganda": [32.3, 1.4], "Mongolia": [103.8, 46.8], "Norway": [15, 65]};

  Object.entries(SMALL_TARGETS).forEach(([country, lonlat]) => {
    const [px, py] = projection(lonlat);
    svgG.append('circle')
      .attr('class','hit-target')
      .attr('cx', px).attr('cy', py)
      .attr('r', 12)
      .attr('fill', 'transparent')
      .attr('stroke', 'none')
      .style('cursor', 'default')
      .on('mouseenter', function() {
        document.getElementById('hover-chip-name').textContent = country;
        const ph = getPhaseForCountry(country);
        document.getElementById('hover-chip-name').style.color =
          (activePhase !== null && ph === activePhase) ? PHASE_COLORS[activePhase] : '';
      })
      .on('mouseleave', function() {
        document.getElementById('hover-chip-name').textContent = '—';
        document.getElementById('hover-chip-name').style.color = '';
      })
      .on('click', function(e) {
        e.stopPropagation();
        const ph = getPhaseForCountry(country);
        if (activePhase !== null && ph === activePhase) {
          if (selectedCountry === country) {
            resetZoom(); closeCard();
            document.getElementById('mobile-info-card').classList.remove('visible');
            selectedCountry = null;
          } else {
            zoomToCountry(country); showCard(country);
          }
        }
      });
  });

  annotationsG=svgEl.append('g');

  svgEl.on('click',e=>{
    if(e.target.tagName==='svg'||e.target===svgEl.node()){resetZoom();closeCard();}
  });
}

function buildSheetGrid() {
  if (activePhase === null) return '';
  const C = COPY[lang];
  const ph = activePhase;
  const col = PHASE_COLORS[ph];

  const countries = Object.entries(NGO_DATA)
    .filter(([, data]) => data.phase === ph)
    .sort(([a], [b]) => a.localeCompare(b));

  return countries.map(([country, data]) => {
    const nonLabdoo = data.ngos.filter(n => !n.name.toLowerCase().startsWith('labdoo'))
      .sort((a, b) => (lang==='cn'?a.name_cn:a.name).localeCompare(lang==='cn'?b.name_cn:b.name));
    const labdoos = data.ngos.filter(n => n.name.toLowerCase().startsWith('labdoo'))
      .sort((a, b) => (lang==='cn'?a.name_cn:a.name).localeCompare(lang==='cn'?b.name_cn:b.name));
    const sorted = [...nonLabdoo, ...labdoos];

    const ngoRows = sorted.map(ngo => {
      const name = lang === 'cn' ? ngo.name_cn : ngo.name;
      const url = ngo.url && ngo.url !== '' ? ngo.url : null;
      const href = url ? (url.startsWith('http') ? url : 'https://' + url) : null;
      return `<div class="modal-ngo-item">
        <span class="modal-ngo-dot" style="background:${col}"></span>
        <span class="modal-ngo-name">${name}</span>
        ${href ? `<a class="modal-ngo-link" href="${href}" target="_blank" rel="noopener">↗</a>` : ''}
      </div>`;
    }).join('');

    return `<div class="modal-country-card">
      <div class="modal-country-name" style="color:${col}">${country}</div>
      ${ngoRows}
    </div>`;
  }).join('');
}

function openMobileSheet() {
  if (activePhase === null) return;
  const C = COPY[lang];

  const phLabel = [C.p1num, C.p2num, C.p3num][ph - 1];

  document.getElementById('mobile-sheet-title').textContent = C.ngoChipLabel + ' · ' + phLabel;

function closeMobileSheet() {
  document.getElementById('mobile-sheet-overlay').classList.remove('open');
  document.getElementById('mobile-sheet').classList.remove('open');

}

// Swipe down to close mobile sheet
(function() {
  let startY = 0, currentY = 0, isDragging = false;
  const THRESHOLD = 80; // px to swipe down before dismissing

  function onTouchStart(e) {
    const sheet = document.getElementById('mobile-sheet');
    const body = document.getElementById('mobile-sheet-body');
    // Only start drag when at top of scroll or touching handle
    if (body.scrollTop > 0) return;
    startY = e.touches[0].clientY;
    isDragging = true;
    sheet.classList.add('dragging');
  }

  function onTouchMove(e) {
    if (!isDragging) return;
    currentY = e.touches[0].clientY;
    const delta = currentY - startY;
    if (delta < 0) return; // don't allow pulling up
    const sheet = document.getElementById('mobile-sheet');
    sheet.style.transform = `translateY(${delta}px)`;
    e.preventDefault();
  }

  function onTouchEnd() {
    if (!isDragging) return;
    isDragging = false;
    const sheet = document.getElementById('mobile-sheet');
    sheet.classList.remove('dragging');
    const delta = currentY - startY;
    if (delta > THRESHOLD) {
      closeMobileSheet();
      sheet.style.transform = '';
    } else {
      sheet.style.transform = '';
    }
    startY = 0; currentY = 0;
  }

  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('mobile-sheet-handle');
    const sheet = document.getElementById('mobile-sheet');
    handle.addEventListener('touchstart', onTouchStart, { passive: true });
    sheet.addEventListener('touchmove', onTouchMove, { passive: false });
    sheet.addEventListener('touchend', onTouchEnd, { passive: true });
  });
})();

function highlightSisterCountries() {
  if (!svgG) return;
  const sisterCountries = new Set(SISTER_CITIES.map(s => s.country));
  svgG.selectAll('path.country')
    .transition().duration(520).ease(d3.easeCubicOut)
    .attr('fill', function() {
      const name = resolveCountry(d3.select(this).attr('data-name'));
      if (sisterCountries.has(name)) return SISTER_COLOR;
      return '#141414';
    });
  // Add city labels as annotations
  if (annotationsG) annotationsG.selectAll('*').remove();
  const usedCentroids = {};
  SISTER_CITIES.forEach(s => {
    const centroid = CENTROIDS[s.country];
    if (!centroid) return;
    const off = LABEL_OFF[s.country] || [20, -10, 'start'];
    const [px, py] = projFn(centroid);
    // Offset slightly if same country used twice
    const key = s.country;
    const extra = usedCentroids[key] || 0;
    usedCentroids[key] = extra + 1;
    const tx = px + off[0], ty = py + off[1] + extra * 8;

    annotationsG.append('line')
      .attr('x1',px).attr('y1',py).attr('x2',tx).attr('y2',ty)
      .attr('stroke',SISTER_COLOR).attr('stroke-width',0.5).attr('stroke-opacity',0)
      .attr('stroke-dasharray','2,2')
      .transition().delay(60).duration(400).attr('stroke-opacity',0.4);

    annotationsG.append('circle').attr('cx',px).attr('cy',py).attr('r',2)
      .attr('fill',SISTER_COLOR).attr('opacity',0)
      .transition().delay(60).duration(400).attr('opacity',0.8);

    const g = annotationsG.append('g').attr('opacity',0);
    g.append('text')
      .attr('x', tx+(off[2]==='start'?3:-3)).attr('y',ty)
      .attr('text-anchor',off[2]).attr('dominant-baseline','middle')
      .attr('fill','rgba(255,255,255,0.8)')
      .style('font-size','5.5px').style('font-style','italic')
      .style('font-family','Noto Sans SC,Inter,sans-serif').style('pointer-events','none')
      .text(lang==='cn' ? SISTER_CITIES_CN[SISTER_CITIES.indexOf(s)].city : s.city);
    g.transition().delay(100).duration(450).attr('opacity',1);
  });
}

// Sister Cities Modal
function openSisterModal() {
  const C = COPY[lang];
  const list = lang === 'cn' ? SISTER_CITIES_CN : SISTER_CITIES;
  const PHASE_COLORS_MAP = {1:'#22c55e', 2:'#eab308', 3:'#3b82f6'};
  const PHASE_LABELS = lang==='cn'
    ? {1:'第一阶段',2:'第二阶段',3:'第三阶段'}
    : {1:'Phase 1',2:'Phase 2',3:'Phase 3'};

  // Sort: Phase 2 first (more), then Phase 3
  const sorted = [...list].sort((a,b) => a.phase - b.phase || a.country.localeCompare(b.country));

  document.getElementById('ngo-modal-title').textContent =
    lang==='cn' ? '🌸 友好城市' : '🌸 Sister Cities';
  document.getElementById('ngo-modal-meta').textContent =
    lang==='cn' ? `${list.length} 个城市 · 按阶段排列` : `${list.length} cities · sorted by phase`;

  const grid = document.getElementById('ngo-modal-grid');
  grid.style.gridTemplateColumns = 'repeat(auto-fill,minmax(240px,1fr))';
  grid.innerHTML = sorted.map(s => {
    const phCol = PHASE_COLORS_MAP[s.phase];
    const phLabel = PHASE_LABELS[s.phase];
    const ngoRows = s.ngos.map(ngo =>
      `<div class="modal-ngo-item">
        <span class="modal-ngo-dot" style="background:${SISTER_COLOR}"></span>
        <span class="modal-ngo-name">${ngo}</span>
      </div>`
    ).join('');
    return `<div class="modal-country-card" style="border-color:rgba(236,72,153,0.2)">
      <div class="modal-country-name" style="color:${SISTER_COLOR};border-color:rgba(236,72,153,0.15)">
        ${s.city}
        <span style="font-size:9px;font-weight:400;color:${phCol};margin-left:6px;font-style:normal;font-family:Inter,sans-serif">${phLabel}</span>
      </div>
      <div style="font-size:10px;color:var(--text-muted);margin-bottom:6px">${s.country}</div>
      <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);margin-bottom:6px">${lang==='cn'?'相关机构':'NGO Partners'} (${s.ngos.length})</div>
      ${ngoRows}
    </div>`;
  }).join('');

  document.getElementById('ngo-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// ═══════════════════════════════════════════
// NGO LIST MODAL
// ═══════════════════════════════════════════
function openNgoModal() {
  if (activePhase === null) return;
  const C = COPY[lang];
  const ph = activePhase;
  const col = PHASE_COLORS[ph];
  const phLabel = [C.p1num, C.p2num, C.p3num][ph - 1];

  // Title + meta
  document.getElementById('ngo-modal-title').textContent = C.ngoChipLabel + ' · ' + phLabel;
  document.getElementById('ngo-modal-meta').textContent =
    NGO_COUNTS[ph] + (lang === 'cn' ? ' 个机构 · 按国家字母顺序排列' : ' NGOs · sorted alphabetically by country');

  // Build sorted country list for this phase
  const countries = Object.entries(NGO_DATA)
    .filter(([, data]) => data.phase === ph)
    .sort(([a], [b]) => a.localeCompare(b));

  const grid = document.getElementById('ngo-modal-grid');
  grid.innerHTML = countries.map(([country, data]) => {
    // Sort NGOs: non-Labdoo first, then Labdoo
    const nonLabdoo = data.ngos.filter(n => !n.name.toLowerCase().startsWith('labdoo'))
      .sort((a, b) => (lang==='cn'?a.name_cn:a.name).localeCompare(lang==='cn'?b.name_cn:b.name));
    const labdoos = data.ngos.filter(n => n.name.toLowerCase().startsWith('labdoo'))
      .sort((a, b) => (lang==='cn'?a.name_cn:a.name).localeCompare(lang==='cn'?b.name_cn:b.name));
    const sorted = [...nonLabdoo, ...labdoos];

    const ngoRows = sorted.map(ngo => {
      const name = lang === 'cn' ? ngo.name_cn : ngo.name;
      const url = ngo.url && ngo.url !== '' ? ngo.url : null;
      const href = url ? (url.startsWith('http') ? url : 'https://' + url) : null;
      return `<div class="modal-ngo-item">
        <span class="modal-ngo-dot" style="background:${col}"></span>
        <span class="modal-ngo-name">${name}</span>
        ${href ? `<a class="modal-ngo-link" href="${href}" target="_blank" rel="noopener">↗</a>` : ''}
      </div>`;
    }).join('');

    return `<div class="modal-country-card">
      <div class="modal-country-name" style="color:${col}">${country}</div>
      ${ngoRows}
    </div>`;
  }).join('');

  document.getElementById('ngo-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeNgoModal() {
  document.getElementById('ngo-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  // If closed from sister modal, deactivate sister
  if (sisterActive) {
    sisterActive = false;
    document.getElementById('btn-sister').classList.remove('active');
    [1,2,3].forEach(n => { document.getElementById('btn'+n).style.opacity = ''; });
    animateAll();
    if (annotationsG) annotationsG.selectAll('*').remove();
    if (activePhase !== null) { animateAll(); drawAnnotations(); }
  }
}

function handleModalOverlayClick(e) {
  if (e.target === document.getElementById('ngo-modal-overlay')) closeNgoModal();
}

// Escape key closes modal
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeNgoModal(); });

// ═══════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════
renderUI();
updateNgoChip();
updateMobileBar();
document.getElementById('btn-sister').textContent = 'Sister Cities';
initMap();
</script>
